name: ThreeMin
options:
  bundleIdPrefix: de.personal.threemin
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  ThreeMinPhone:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    info:
      path: Config/Phone-Info.plist
      properties:
        CFBundleDisplayName: 3Min
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.personal.threemin
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - target: ThreeMinWatch
        embed: true
  ThreeMinWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: 3Min
        WKApplication: true
        WKCompanionAppBundleIdentifier: de.personal.threemin
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [audio]
        NSHealthShareUsageDescription: Dein Puls unterstützt den Sensortest und später die Erkennung einzelner Satzenden. Die Daten bleiben zunächst auf deinen Geräten.
        NSHealthUpdateUsageDescription: 3Min speichert deine ausdrücklich gestartete Krafttrainingssitzung als Training in Health.
        NSMotionUsageDescription: Bewegungsdaten werden während deiner Trainingssitzung lokal aufgezeichnet, um Satzenden zu lernen.
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.personal.threemin.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
schemes:
  ThreeMin:
    build:
      targets:
        ThreeMinPhone: all
        ThreeMinWatch: all
    run:
      executable: ThreeMinPhone
  ThreeMinWatch:
    build:
      targets:
        ThreeMinWatch: all
    run:
      executable: ThreeMinWatch
